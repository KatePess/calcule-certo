# Sobe apenas o banco de dados PostgreSQL do Calcule Certo.
# O back-end e o front-end rodam fora do Docker durante o desenvolvimento.
services:
  db:
    image: postgres:16-alpine
    container_name: calcule-certo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: calcule
      POSTGRES_PASSWORD: calcule
      POSTGRES_DB: calcule_certo
    ports:
      - "5432:5432"
    volumes:
      - dados_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calcule -d calcule_certo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados_pg:
